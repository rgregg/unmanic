---
name: Bug Report
description: Please do not use bug reports for support issues.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Trawlarr is a fork of [Unmanic](https://github.com/Unmanic/unmanic). Please check
        whether the same behaviour happens in upstream Unmanic — if it does, upstream is
        usually the better place to report it. This fork carries a specific set of changes,
        documented in [FORK.md](https://github.com/rgregg/trawlarr/blob/main/FORK.md).

        **Plugin bugs belong with the plugin.** Plugins are third-party code; file those
        against the plugin's own source repository.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List each action required in order to reproduce the issue.
      placeholder: |
        1. First Step '...'
        2. Second Step '...'
        3. So on '...'
        4. See error
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Provide screenshots to help explain your problem.
  - type: textarea
    id: relevant
    attributes:
      label: Relevant Settings
      description: Include all settings/configuration that are relevant to your setup.
      placeholder: |
        - eg. Configuration of your Docker container.
        - eg. Configurations within the application/container.
        - eg. External processes that you have connected to or communicating with the application/container.
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        The version is the first line printed in the Docker log, and is also shown in the
        footer of the web UI. If you are running a tagged image, include the tag too.
      placeholder: "Build: [27/07/26 03:09:26] [main] [477e25f82c2612b6345ca0c9777345e6b5129965]"
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: |
        Detail the host OS platform, version and software versions.
          - Distribution: `$(. /etc/os-release; echo "${NAME} - ${VERSION}")`
          - Linux Kernel: `$(uname -rpio)`
          - GPU Driver versions: `$(nvidia-smi | grep 'Version:')`
          - Docker: `$(docker -v)`
          - Docker-compose: `$(docker compose -v)`
      placeholder: |
        - Distribution:
        - Linux Kernel:
        - GPU Driver versions:
        - Docker:
        - Docker-compose:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output.
        This will be automatically formatted into code, so no need for backticks.
        Note: Most relevant logs are found either in the docker logs or inside the container
        in /config/.trawlarr/logs/. Logs contain file paths and file names from your library —
        review and redact before posting.
      render: Shell
  - type: markdown
    attributes:
      value: |
        Make sure to close your issue when it's solved! If you found the solution yourself please comment so that others benefit from it.
