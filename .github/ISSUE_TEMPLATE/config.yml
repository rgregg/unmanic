---

blank_issues_enabled: false
contact_links:
  - name: Using the application
    url: https://docs.unmanic.app/
    about: >
      Trawlarr's day-to-day behaviour matches upstream Unmanic. Their
      documentation covers libraries, plugins, workers and the API.
  - name: Plugin requests
    url: https://github.com/Unmanic/unmanic-plugins/issues
    about: >
      New plugin requests only. Bugs in an individual plugin belong in that
      plugin's own source repository, not here.
  - name: Upstream Unmanic issues
    url: https://github.com/Unmanic/unmanic/issues
    about: >
      If the behaviour also happens in upstream Unmanic, reporting it there
      means the fix reaches everyone.
