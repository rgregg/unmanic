---
name: Feature Request
description: Suggest a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve Trawlarr!

        A good number of ideas are better served as **plugins** than as core changes.
        Trawlarr uses the upstream Unmanic plugin architecture and pulls plugin catalogs
        directly from GitHub, so a plugin usually ships faster and does not need a
        release. New plugin requests go to https://github.com/Unmanic/unmanic-plugins.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: If so, please provide clear and concise description of the problem.
      placeholder: eg. I'm always frustrated when '...'
  - type: textarea
    id: feature
    attributes:
      label: What is your feature request?
      description: A clear and concise description of the feature.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Are there any workarounds?
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
