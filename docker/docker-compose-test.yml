################
# Test environment Docker Compose file
#
# This compose file is only good for automated testing.
#
# UPSTREAM-INHERITED AND NOT USED BY CI. The fork's test suite runs on the
# host (`pytest tests/unit/ --cov=trawlarr`); see ../tests/README.md. This
# file is kept for the upstream `tests/` flow and has not been verified
# against this fork.
#
# docker compose -f ./docker/docker-compose-test.yml exec --workdir=/app trawlarr-testenv pytest --log-cli-level=INFO
#

version: "2"

services:
  trawlarr-testenv:
    container_name: trawlarr-testenv
    image: ghcr.io/rgregg/trawlarr:dev
    ports:
      - 8888:8888
    # user: "1000:1000"
    environment:
      - PUID=1000
      - PGID=1000
      - DEBUGGING=false
      - USE_CUSTOM_SUPPORT_API=disabled # Can be "disabled", "test" or "dev"
      - NUMBER_OF_WORKERS=2
      - SCHEDULE_FULL_SCAN_MINUTES=10
      - RUN_FULL_SCAN_ON_START=false
      - TZ=Pacific/Auckland
    volumes:
      - ../tests/tmp/cache:/tmp/unmanic
      - ../tests/tmp/library:/library
      - ../tests:/app/tests
      - ../:/app
      # Uncomment for debugging of tests within the docker container
      # Note that some tests are setup to only succeed with a particular configuration
      # and modifying the configuration may cause tests to fail unexpectedly.
      # - ../tests/tmp/config:/config
