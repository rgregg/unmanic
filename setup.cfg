# Packaging metadata moved to pyproject.toml in issue #58. What is left
# here is configuration for two tools that still cannot read pyproject.toml:
# flake8 (upstream refuses to support it) and pycodestyle. Do not add
# distribution metadata below -- setuptools would silently merge it with,
# and in places override, the PEP 621 table.

[pycodestyle]
# TODO: Fix these errors
ignore = E722,E241,W293
max-line-length = 127
statistics = True
exclude = venv/**,.idea/**,dev_environment/**,dist/**
show-pep8 = False
show-source = False

[flake8]
# TODO: Fix these errors
ignore = E722,E241,W293,F401,F403,F405,F841
max-line-length = 200
exclude = venv/**,.idea/**,dev_environment/**,dist/**
