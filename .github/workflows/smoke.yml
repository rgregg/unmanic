name: Smoke test

# Boots the image the build workflow just pushed, in throwaway
# containers, and verifies three lifecycle paths an operator actually hits:
#
#  1. FIRST BOOT, against an empty /config:
#     - Webserver responds on /version/read (HEALTHCHECK probe target)
#     - /session/state reports level == LOCAL_SESSION_LEVEL (default 7)
#     - The runtime paths moved (.trawlarr) and the old ones did not
#     - No outbound calls to api.unmanic.app appear in the container logs
#
#  2. SECOND BOOT, against the /config the first boot just created:
#     - Comes up again, on the same database file, keeping settings written
#       over the API. Every upgrade and every container restart takes this
#       path, and until now nothing exercised it: a change that only broke
#       existing installs would have shipped with this workflow green.
#
#  3. LEGACY CONFIG, against a /config holding an Unmanic `.unmanic` dir:
#     - Refuses to start, exits non-zero, prints the migration, and touches
#       nothing. This is the single most operator-visible behaviour the
#       rename added, and the one with the worst failure mode if it
#       regresses: a silent "brand new installation" on top of live data.
#
# Runs after the build workflow completes so we catch fork-introduced
# regressions before cutting Komodo over to a new image. Failure flags
# the freshly-pushed image as suspect.
#
# Which tag gets tested depends on what triggered the build: continuous
# main builds are tested at :dev, release builds at their exact version
# tag. Testing :latest would be wrong for prereleases, which never move it.

on:
  workflow_run:
    workflows: ["Build image"]
    types: ["completed"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to smoke test"
        required: false
        default: "dev"

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Smoke test the freshly built image
    runs-on: ubuntu-latest
    # Only run if the upstream build succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          TRIGGERING_EVENT: ${{ github.event.workflow_run.event }}
          # For a release-triggered build, workflow_run.head_branch carries
          # the release tag rather than a branch name.
          TRIGGERING_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          ORG=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG:-dev}"
          elif [[ "${TRIGGERING_EVENT}" == "release" ]]; then
            TAG="${TRIGGERING_REF}"
          else
            TAG="dev"
          fi
          echo "Smoke testing tag: ${TAG}"
          echo "name=ghcr.io/${ORG}/trawlarr:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker pull "$IMAGE"

      - name: Run container with isolated config
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/unmanic-config" "$RUNNER_TEMP/unmanic-cache" "$RUNNER_TEMP/unmanic-library"
          # Detached, named, with the same fork env knob in play. No NVIDIA
          # device passthrough — smoke test exercises the API and config,
          # not actual transcoding.
          docker run -d --name trawlarr-smoke \
            -p 127.0.0.1:8888:8888 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -v "$RUNNER_TEMP/unmanic-config:/config" \
            -v "$RUNNER_TEMP/unmanic-library:/library" \
            -v "$RUNNER_TEMP/unmanic-cache:/tmp/unmanic" \
            "$IMAGE"

      - name: Wait for /version/read
        run: |
          # Poll the HEALTHCHECK endpoint. Up to 3 minutes — first boot
          # runs DB migrations and initial plugin repo refresh.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8888/trawlarr/api/v2/version/read >/dev/null 2>&1; then
              echo "Webserver up after ~$((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Webserver did not come up within 180s"
          docker logs trawlarr-smoke | tail -200
          exit 1

      - name: Verify session level is pinned
        run: |
          STATE=$(curl -fsS http://127.0.0.1:8888/trawlarr/api/v2/session/state)
          echo "session/state: $STATE"
          LEVEL=$(echo "$STATE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("level"))')
          if [[ "$LEVEL" != "7" ]]; then
            echo "::error::Expected session level 7, got: $LEVEL"
            exit 1
          fi
          echo "Session level pinned at 7 as expected."

      - name: Verify version endpoint
        run: |
          # Sanity check that the version endpoint returns a real value,
          # not just any-200.
          VER=$(curl -fsS http://127.0.0.1:8888/trawlarr/api/v2/version/read)
          echo "version/read: $VER"
          echo "$VER" | python3 -c 'import json,sys; d=json.load(sys.stdin); v=d.get("version") or d.get("data",{}).get("version"); assert v, "no version field"; print(f"version: {v}")'

      - name: Verify the runtime paths moved and the old ones are gone
        run: |
          # The config directory and the API prefix both moved from
          # unmanic to trawlarr, with no alias for either. Assert the new
          # locations exist and the old API path is a hard 404 — a silent
          # fallback to the old names is exactly the failure this rename
          # is meant not to have.
          fail=0

          if [[ ! -d "$RUNNER_TEMP/unmanic-config/.trawlarr/config" ]]; then
            echo "::error::Expected config directory /config/.trawlarr/config was not created"
            fail=1
          fi
          if [[ ! -f "$RUNNER_TEMP/unmanic-config/.trawlarr/config/trawlarr.db" ]]; then
            echo "::error::Expected database /config/.trawlarr/config/trawlarr.db was not created"
            fail=1
          fi
          if [[ -d "$RUNNER_TEMP/unmanic-config/.unmanic" ]]; then
            echo "::error::Legacy config directory /config/.unmanic was created"
            fail=1
          fi

          # settings.json must not carry absolute runtime paths. If it does,
          # the next start reads them back and pins the install to whatever
          # directory it happened to be using when the file was written —
          # which is how a completed .unmanic -> .trawlarr move undoes
          # itself, silently, one restart later.
          SETTINGS="$RUNNER_TEMP/unmanic-config/.trawlarr/config/settings.json"
          if [[ -f "$SETTINGS" ]]; then
            echo "--- settings.json ---"
            cat "$SETTINGS"
            echo
            LEAKED=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(" ".join(sorted({"config_path","log_path","plugins_path","userdata_path"} & set(d))))' "$SETTINGS")
            if [[ -n "$LEAKED" ]]; then
              echo "::error::settings.json persists derived runtime paths: $LEAKED"
              fail=1
            fi
          fi

          OLD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/unmanic/api/v2/version/read)
          echo "GET /unmanic/api/v2/version/read -> $OLD_STATUS"
          if [[ "$OLD_STATUS" != "404" ]]; then
            echo "::error::Legacy API path answered $OLD_STATUS; it must 404"
            fail=1
          fi
          # Specifically not a redirect: RedirectHandler is permanent by
          # default, and a cached 301 hands an API client HTML in place of
          # JSON long after the server stops sending it.
          OLD_LOCATION=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8888/unmanic/api/v2/version/read)
          if [[ -n "$OLD_LOCATION" ]]; then
            echo "::error::Legacy API path redirected to $OLD_LOCATION; it must not redirect"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "Runtime paths verified."

      - name: Check container logs for regressions
        run: |
          # The fork stubs out every phone-home path. If any layer still
          # reaches out (a plugin schedule, a missed call site, a frontend
          # request reverse-proxied via an api endpoint), we want it loud.
          LOGS="$RUNNER_TEMP/container.log"
          # Redirection order matters and was wrong here: `2>&1 > file`
          # points stderr at the *old* stdout (the step log) and only then
          # sends stdout to the file, so nothing the container wrote to
          # stderr ever reached the greps below. Tracebacks -- including the
          # ScheduledTasksManager crash this step exists to catch -- go to
          # stderr. `> file 2>&1` is the order that captures both.
          docker logs trawlarr-smoke > "$LOGS" 2>&1
          echo "--- container log tail ---"
          tail -80 "$LOGS"
          echo "--- end container log ---"

          fail=0

          # 1. No outbound calls to api.unmanic.app or its sub-services.
          if grep -E "(api\.unmanic\.app|support-auth-api|unmanic-api/v[0-9])" "$LOGS"; then
            echo "::error::Found api.unmanic.app references in container logs"
            fail=1
          fi

          # 2. The scheduler dict-vs-model bug must not return. It killed
          # the ScheduledTasksManager thread at startup in upstream and
          # silently disabled completed-task cleanup. We patched it; this
          # check ensures a future rebase doesn't reintroduce it.
          if grep -E "AttributeError.*'dict' object has no attribute 'id'" "$LOGS"; then
            echo "::error::ScheduledTasksManager AttributeError regression — see scheduler.py"
            fail=1
          fi

          # 3. The ScheduledTasksManager thread should not have crashed.
          if grep -E "Exception in thread ScheduledTasksManager" "$LOGS"; then
            echo "::error::ScheduledTasksManager thread crashed — see container log artifact"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "All log regression checks passed."

      - name: Healthcheck status
        run: |
          # Give the HEALTHCHECK a couple of cycles to run.
          sleep 10
          STATUS=$(docker inspect --format '{{.State.Health.Status}}' trawlarr-smoke)
          echo "Healthcheck status: $STATUS"
          if [[ "$STATUS" != "healthy" ]]; then
            echo "::warning::Healthcheck status is '$STATUS' (expected 'healthy'). Probe may need more time on cold start."
          fi

      # ---------------------------------------------------------------
      # 2. Second boot: the same /config, an install that already exists.
      # ---------------------------------------------------------------

      - name: Record state the restart must preserve
        id: preserve
        run: |
          # Two independent signals that the second boot adopted this
          # install rather than quietly starting a new one beside it:
          #
          #  - the database inode. A fresh install creates a new file; a
          #    restart opens the same one. Comparing inodes catches a
          #    rename/relocate that a "does the file exist" check would not.
          #  - a setting written over the API. The inode says the file was
          #    reused; this says its *contents* were read back. A boot that
          #    reset settings to defaults would keep the inode and still be
          #    a data-loss bug.
          set -euo pipefail
          DB="$RUNNER_TEMP/unmanic-config/.trawlarr/config/trawlarr.db"
          stat -c %i "$DB" > "$RUNNER_TEMP/db-inode-first"
          echo "database inode before restart: $(cat "$RUNNER_TEMP/db-inode-first")"

          MARKER="smoke-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"settings\": {\"installation_name\": \"${MARKER}\"}}" \
            http://127.0.0.1:8888/trawlarr/api/v2/settings/write
          echo

          # Confirm it took effect in the running process before we rely on
          # it surviving anything. If this fails, the restart assertion
          # below would fail for a reason that has nothing to do with restarts.
          READBACK=$(curl -fsS http://127.0.0.1:8888/trawlarr/api/v2/settings/read \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["settings"].get("installation_name",""))')
          if [[ "$READBACK" != "$MARKER" ]]; then
            echo "::error::settings/write did not take effect in the running process (read back '$READBACK')"
            exit 1
          fi
          echo "Marker '${MARKER}' set and read back."

      - name: Stop the first container and start a second on the same config
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # Deliberately a new container rather than `docker restart`: an
          # upgrade replaces the container, and that is the path worth
          # testing. Same volumes, same env, different container.
          set -euo pipefail
          docker logs trawlarr-smoke > "$RUNNER_TEMP/first-boot.log" 2>&1 || true
          docker rm -f trawlarr-smoke >/dev/null

          docker run -d --name trawlarr-restart \
            -p 127.0.0.1:8888:8888 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -v "$RUNNER_TEMP/unmanic-config:/config" \
            -v "$RUNNER_TEMP/unmanic-library:/library" \
            -v "$RUNNER_TEMP/unmanic-cache:/tmp/unmanic" \
            "$IMAGE"

      - name: Wait for the existing install to come up
        run: |
          # Shorter budget than first boot on purpose: an existing install
          # has already run its migrations and its first plugin refresh, so
          # if it is taking first-boot time something is being redone.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8888/trawlarr/api/v2/version/read >/dev/null 2>&1; then
              echo "Existing install up after ~$((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Existing install did not come up within 120s"
          docker logs trawlarr-restart | tail -200
          exit 1

      - name: Verify the second boot adopted the existing install
        env:
          MARKER: ${{ steps.preserve.outputs.marker }}
        run: |
          fail=0
          DB="$RUNNER_TEMP/unmanic-config/.trawlarr/config/trawlarr.db"

          INODE_BEFORE=$(cat "$RUNNER_TEMP/db-inode-first")
          INODE_AFTER=$(stat -c %i "$DB")
          echo "database inode: before=${INODE_BEFORE} after=${INODE_AFTER}"
          if [[ "$INODE_BEFORE" != "$INODE_AFTER" ]]; then
            echo "::error::Database was replaced across the restart — the second boot did not reuse the existing install"
            fail=1
          fi

          READBACK=$(curl -fsS http://127.0.0.1:8888/trawlarr/api/v2/settings/read \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["settings"].get("installation_name",""))')
          echo "installation_name after restart: '${READBACK}'"
          if [[ "$READBACK" != "$MARKER" ]]; then
            echo "::error::Setting did not survive the restart (expected '${MARKER}', got '${READBACK}')"
            fail=1
          fi

          # An existing install must never trip the legacy guard, and must
          # never grow a legacy directory of its own.
          if [[ -d "$RUNNER_TEMP/unmanic-config/.unmanic" ]]; then
            echo "::error::Legacy config directory /config/.unmanic appeared on the second boot"
            fail=1
          fi
          if docker logs trawlarr-restart 2>&1 | grep -q "refused to start"; then
            echo "::error::Existing install hit the legacy-config guard"
            docker logs trawlarr-restart 2>&1 | tail -60
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "Existing install came back intact."

      - name: Tear down the restart container
        if: always()
        run: |
          if docker inspect trawlarr-restart >/dev/null 2>&1; then
            docker logs trawlarr-restart > "$RUNNER_TEMP/second-boot.log" 2>&1 || true
            docker rm -f trawlarr-restart || true
          fi

      # ---------------------------------------------------------------
      # 3. Legacy config directory: must refuse to start.
      # ---------------------------------------------------------------

      - name: Refuse to start on a legacy .unmanic config directory
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # A separate, untouched /config holding what an Unmanic install
          # leaves behind. The guard fires on "the legacy directory holds
          # data and the new one does not", so a single file is enough --
          # and using a file rather than a copy of the real database keeps
          # this independent of whatever schema the image ships.
          set -uo pipefail
          LEGACY="$RUNNER_TEMP/legacy-config"
          mkdir -p "$LEGACY/.unmanic/config"
          echo "not a real database, and it does not need to be" \
            > "$LEGACY/.unmanic/config/unmanic.db"

          # Foreground, no published port, with a wall clock on it. The
          # expected outcome is a container that exits by itself; `timeout`
          # is here to turn "never exits" into a distinguishable failure
          # rather than a hung job.
          set +e
          timeout 300 docker run --rm --name trawlarr-legacy \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -v "$LEGACY:/config" \
            "$IMAGE" > "$RUNNER_TEMP/legacy-boot.log" 2>&1
          RC=$?
          # `set -e` stays off from here: every check below accumulates into
          # `fail` so that one failing assertion still prints the others,
          # and the step exits deliberately at the end.

          echo "--- legacy-config boot log ---"
          cat "$RUNNER_TEMP/legacy-boot.log"
          echo "--- end legacy-config boot log ---"
          echo "container exit code: ${RC}"

          fail=0

          # 124 is `timeout` killing it. That means the container was still
          # running -- i.e. it started anyway, which is the exact regression
          # this step exists to catch. It must not be read as "non-zero, good".
          if [[ "$RC" -eq 124 ]]; then
            echo "::error::Container was still running after 300s on a legacy .unmanic config; it must refuse to start"
            fail=1
          elif [[ "$RC" -eq 0 ]]; then
            echo "::error::Container exited 0 on a legacy .unmanic config; it must exit non-zero"
            fail=1
          else
            echo "Exited ${RC} as expected."
          fi

          # The exit code alone is not enough: any crash is non-zero. The
          # operator-facing message is the actual deliverable here, so
          # assert on the parts of it they need -- both directory paths and
          # the migration command.
          for needle in \
            "refused to start" \
            "/config/.unmanic" \
            "/config/.trawlarr" \
            "mv /config/.unmanic /config/.trawlarr" \
            "TRAWLARR_IGNORE_LEGACY_CONFIG"
          do
            if ! grep -qF -- "$needle" "$RUNNER_TEMP/legacy-boot.log"; then
              echo "::error::Refusal message is missing: ${needle}"
              fail=1
            fi
          done

          # "We never touch your data" is a promise the message makes in
          # writing. Check it: the legacy directory must be exactly as we
          # left it, and no install may have been created next to it.
          if [[ ! -f "$LEGACY/.unmanic/config/unmanic.db" ]]; then
            echo "::error::The legacy database was moved or removed; the guard must not touch operator data"
            fail=1
          fi
          if [[ -f "$LEGACY/.trawlarr/config/trawlarr.db" ]]; then
            echo "::error::A new install was created despite the refusal"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "Legacy config directory refusal verified."

      - name: Tear down
        if: always()
        run: |
          # Capture whatever has not been captured yet. A failure part-way
          # through leaves one of these containers alive and its log is the
          # only evidence of why, so grab it before removing anything.
          if [[ ! -s "$RUNNER_TEMP/first-boot.log" ]]; then
            docker logs trawlarr-smoke > "$RUNNER_TEMP/first-boot.log" 2>&1 || true
          fi
          if [[ ! -s "$RUNNER_TEMP/second-boot.log" ]]; then
            docker logs trawlarr-restart > "$RUNNER_TEMP/second-boot.log" 2>&1 || true
          fi
          docker rm -f trawlarr-smoke trawlarr-restart trawlarr-legacy || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-container-logs
          # One artifact, one file per boot, so a failure can be read
          # against the phase it happened in. if-no-files-found is left at
          # the default warn: an early failure legitimately produces only
          # the first of these.
          path: |
            ${{ runner.temp }}/first-boot.log
            ${{ runner.temp }}/second-boot.log
            ${{ runner.temp }}/legacy-boot.log
          retention-days: 14
