name: Test

# Runs the test suites on every push to main and on PRs targeting it.
#
# Two independent jobs: the Python package, and the Quasar/Vue frontend.
# Until now nothing checked the frontend before the Docker image build, so a
# broken import in a .vue file reached image-build time undetected. The
# frontend job exists to make that failure loud and early.
#
# The Python job runs both suites named in pytest.ini's `testpaths`:
# `tests/unit/` under the coverage gate, then `tests/integration/`. For a
# long time only the first ran here, so anything that broke the integration
# suite reached main with CI green.
#
# Coverage is reported in the job summary and uploaded as an artifact so
# we can track the trend over time.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    env:
      # THE COVERAGE RATCHET. One number, declared once, used by the gate
      # below and by the drift check that nags when it falls behind.
      #
      # It is a floor, not a target: it sits just under what `main` actually
      # measures, so deleting or disabling a chunk of the suite turns the
      # build red instead of passing quietly. It is NOT the coverage we
      # aspire to.
      #
      # Rules (also in docs/CONTRIBUTING.md, "The coverage ratchet"):
      #   - Raise it in the same PR that raises coverage.
      #   - Never lower it to make a red build green. A lowered floor is a
      #     decision to argue for in the PR, not a fix.
      #
      # Current value: 41. Across 487 unit tests `main` measures 41.76%
      # here on Python 3.10 and 41.72% on a 3.12 checkout — the measurement
      # moves slightly with the interpreter, which is one more reason the
      # floor is a whole number under it rather than flush against it. The
      # margin is deliberately under a point: enough that ordinary
      # refactoring noise does not trip it, small enough that a real
      # regression does. The drift check prints a reminder once actual
      # coverage runs more than PYTHON_COVERAGE_DRIFT points ahead.
      PYTHON_COVERAGE_FLOOR: "51"
      PYTHON_COVERAGE_DRIFT: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check license headers
        run: |
          # Every .py file is either upstream's (Unmanic copyright block) or
          # fork-authored (SPDX identifier). Catches new fork files committed
          # without a header. Policy lives in docs/CONTRIBUTING.md.
          ./devops/check_license_headers.sh

      - name: Lint (errors only)
        run: |
          # E9 syntax errors, F63 invalid is/in comparisons, F7 forward
          # ref syntax, F82 undefined names. Style/E5xx noise from
          # upstream code is intentionally ignored.
          flake8 trawlarr tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with coverage
        run: |
          # --cov=trawlarr narrows coverage to our package (skips dep noise).
          # It must name the real package, not the `unmanic` compatibility
          # alias -- that is a three-line bootstrap, and pointing coverage
          # at it would silently report ~100% of nothing.
          # --cov-report=term-missing shows uncovered lines in the run log
          # --cov-report=xml uploads a machine-readable artifact
          # --cov-report=html for browsable local viewing of the same data
          # --cov-fail-under enforces the ratchet. The number itself and the
          # rules for changing it are at the top of this job, on
          # PYTHON_COVERAGE_FLOOR — one declaration, so nobody has to guess
          # which of several literals is the real gate.
          pytest tests/unit/ -v \
            --cov=trawlarr \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under="${PYTHON_COVERAGE_FLOOR}" \
            --junitxml=pytest-results.xml

      - name: Run integration tests
        run: |
          # pytest.ini lists tests/integration/ in `testpaths`, but for a long
          # time CI ran tests/unit/ only — so this suite was collected by
          # anyone running `pytest` bare, and by nothing that could fail a PR.
          #
          # It needs no services and no network. Every test builds its own
          # migrated SQLite database under a temp HOME, so nothing here can
          # reach a developer's ~/.trawlarr or a runner's home directory.
          #
          # It contains the one test that starts the application and follows a
          # file from the library to "done" (tests/integration/
          # test_pipeline_end_to_end.py, issue #84). Those tests run threads
          # and poll, so they are the slowest here — ~5s each on this runner,
          # against a 120s bound. Every wait in them is bounded and fails
          # naming the step that never happened rather than hanging, because
          # a flaky end-to-end test gets deleted by whoever it wakes at 3am.
          # The whole suite is ~25s.
          #
          # No test in this suite is skipped. Two used to be, carrying upstream
          # markers that predated the TaskHandler's DB integration; they have
          # been rewritten against the database. A permanently skipped test is
          # a lie about coverage, so if you find yourself adding a skip here,
          # delete the test and say why in the commit instead.
          #
          # Deliberately no coverage flags: the ratchet above is a statement
          # about the unit suite, and folding a second suite into the same
          # number would move it for reasons that have nothing to do with
          # anyone's test-writing.
          #
          # --durations=10 so that if these ever get slow enough to be worth
          # moving out of the PR path, the run log says so.
          pytest tests/integration/ -v --durations=10

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            if [ -f coverage.xml ]; then
              # `coverage report` reads .coverage by default, which pytest-cov
              # leaves behind alongside the XML. Markdown format keeps the
              # summary readable in the GHA job summary.
              echo '```'
              coverage report --skip-empty --skip-covered || coverage report
              echo '```'
            else
              echo "_coverage.xml not produced — pytest may have failed before coverage was written_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage ratchet check
        if: always()
        run: |
          # The nag that keeps the floor moving. A ratchet nobody turns is
          # just a low number with a comment attached, so once measured
          # coverage runs more than PYTHON_COVERAGE_DRIFT points ahead of the
          # floor, say so — in the job summary and as a GitHub notice on the
          # run. Deliberately never fails the build: this is a prompt to the
          # next person, not a gate, and a gate here would punish the very
          # PRs that raise coverage.
          # `coverage report --format=total` prints just the percentage, read
          # from the .coverage data file pytest-cov leaves behind. If the test
          # step failed before writing it, there is nothing to check and this
          # step says so rather than guessing.
          ACTUAL=$(coverage report --format=total --precision=2 2>/dev/null || true)
          case "$ACTUAL" in
            ''|*[!0-9.]*)
              echo "_Coverage total unavailable; ratchet check skipped._" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          echo "Measured line coverage: ${ACTUAL}%  (floor ${PYTHON_COVERAGE_FLOOR}%)"
          # floor(actual - 0.5), not floor(actual): a floor a hundredth of a
          # point under the measurement is a tripwire, not a ratchet. Half a
          # point of slack absorbs the normal jitter of adding a few lines of
          # code without tests. It is the same arithmetic that produced the
          # current value from 41.72.
          SUGGESTED=$(python3 -c 'import sys,math; print(math.floor(float(sys.argv[1]) - 0.5))' "$ACTUAL")
          BEHIND=$(python3 -c 'import sys; print("yes" if float(sys.argv[1]) - float(sys.argv[2]) > float(sys.argv[3]) else "no")' \
            "$ACTUAL" "$PYTHON_COVERAGE_FLOOR" "$PYTHON_COVERAGE_DRIFT")
          {
            echo ""
            echo "**Coverage ratchet:** floor \`${PYTHON_COVERAGE_FLOOR}\`, measured \`${ACTUAL}\`."
            if [ "$BEHIND" = "yes" ]; then
              echo ""
              echo "> The floor is more than ${PYTHON_COVERAGE_DRIFT} points behind what this run measured."
              echo "> Raise \`PYTHON_COVERAGE_FLOOR\` in \`.github/workflows/test.yml\` to \`${SUGGESTED}\`,"
              echo "> in this PR, so the coverage you just added cannot be removed unnoticed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" = "yes" ]; then
            echo "::notice title=Raise the coverage floor::Measured ${ACTUAL}% vs floor ${PYTHON_COVERAGE_FLOOR}%. Set PYTHON_COVERAGE_FLOOR=${SUGGESTED} in .github/workflows/test.yml."
          fi

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 30

  frontend:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trawlarr/webserver/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # Matches the Node used by .github/workflows/build.yml, so a green
          # run here means the same toolchain that builds the image is happy.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: trawlarr/webserver/frontend/package-lock.json

      - name: Install dependencies
        # `npm ci`, not `npm install`: it installs exactly the lockfile, so CI
        # cannot pass on a dependency tree nobody has committed.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        # Thresholds live in vitest.config.js. See the ratchet note there and in
        # docs/CONTRIBUTING.md before changing them.
        run: npm run test:coverage

      - name: Build
        # The real prize. Quasar's webpack build is the only thing that resolves
        # every import in every .vue file, so this step is what turns "a broken
        # import reaches the Docker build" into "a broken import fails the PR".
        run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Frontend coverage"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              echo '```'
              node -e '
                const s = require("./coverage/coverage-summary.json").total;
                for (const k of ["statements", "branches", "functions", "lines"]) {
                  console.log(k.padEnd(12), s[k].pct + "%", `(${s[k].covered}/${s[k].total})`);
                }
              '
              echo '```'
              echo ""
              echo "_Statement/line coverage is inflated by modules that are imported but not exercised; \`functions\` is the honest number._"
            else
              echo "_No coverage summary produced — the test step likely failed first._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: trawlarr/webserver/frontend/coverage/
          retention-days: 14
