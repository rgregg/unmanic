# Standalone test instance of the local fork.
#
# Runs ghcr.io/rgregg/unmanic:latest on a separate port (8889) with
# isolated bind mounts that DO NOT touch the real media library. Use it
# to validate fork changes (frontend strips, plugin behaviour, scheduler
# fixes, etc) before cutting Komodo's production stack over.
#
# Usage on media-server:
#   sudo mkdir -p /mnt/local_ssd/stacks/unmanic-test/{config,library,cache}
#   sudo chown -R 1000:1000 /mnt/local_ssd/stacks/unmanic-test
#   docker compose -f docker/docker-compose-test-instance.yml up -d
#
# Browse at http://<host>:8889/
# Distinct from production:
#   - Port 8889 (production = 8888)
#   - /mnt/local_ssd/stacks/unmanic-test/library (production = /mnt/movie-archive)
#   - Separate config + cache dirs
#   - No GPU passthrough — testing the fork's API/cord-cutting invariants
#     does not require a transcode. Add `runtime: nvidia` + the env vars
#     below if you want to test transcode end-to-end.
#
# To wipe state and start fresh:
#   docker compose -f docker/docker-compose-test-instance.yml down
#   sudo rm -rf /mnt/local_ssd/stacks/unmanic-test/{config,cache}/*
#   docker compose -f docker/docker-compose-test-instance.yml up -d
services:
  unmanic-test:
    image: ghcr.io/rgregg/unmanic:latest
    container_name: unmanic-test
    restart: unless-stopped
    ports:
      - "8889:8888"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/local_ssd/stacks/unmanic-test/config:/config
      - /mnt/local_ssd/stacks/unmanic-test/library:/library
      - /mnt/local_ssd/stacks/unmanic-test/cache:/tmp/unmanic
    # GPU passthrough commented out — uncomment to enable transcode testing.
    # Requires nvidia-container-toolkit on the host.
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
