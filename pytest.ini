[pytest]
# Local fork: upstream's pytest.ini set `python_files=tests/*.py` (which
# matched nothing under `tests/unit/`) and a malformed `pytest_plugins`
# entry that emitted warnings on every run. Replaced with conventional
# discovery rules so `pytest tests/unit/` actually finds the test files.
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unittest: marks tests as unit tests (deselect with '-m "not unittest"')
    integrationtest: marks tests as integration tests (deselect with '-m "not integrationtest"')

filterwarnings =
    ignore:.*invalid escape sequence.*:DeprecationWarning
