name: Build image

# Builds the rgregg/trawlarr Docker image and pushes it to GHCR.
#
# Image: ghcr.io/<owner>/trawlarr
#
# On a push to main (continuous builds):
#   :dev                 rolling — newest main build
#   :main-<sha7>         immutable — pin a specific commit
#
# On a published GitHub release tagged X.Y.Z (see FORK.md "Releases"):
#   :X.Y.Z               immutable — exact release
#   :X.Y                 moving — newest patch in that minor line
#   :X                   moving — newest minor+patch in that major line
#   :latest              moving — newest stable release
#
# Prereleases (1.2.0-rc.1, or a release flagged prerelease in the GitHub
# UI) publish ONLY the exact tag. They never move :latest, :X or :X.Y, so
# pinning a major line never drags someone onto a release candidate.

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build wheel + Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch tags (setup.py reads them for the version)
        run: |
          git fetch --prune --unshallow --tags || true
          git tag --list | tail -10

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Build Python wheel
        id: wheel
        run: |
          PY_VERSION=$(python ./setup.py --quiet --version)
          echo "Python version: ${PY_VERSION}"
          python -m build --no-isolation --skip-dependency-check --wheel
          ls -l dist/
          echo "${PY_VERSION}" > dist/VERSION.txt
          echo "py_version=${PY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          ORG=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${ORG}/trawlarr"
          SHA_SHORT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${EVENT_NAME}" == "release" ]]; then
            # Release tags are unprefixed semver (1.2.3), matching the tag
            # convention already in this repo and what versioninfo.py reads
            # via `git describe`. A leading "v" would produce a PEP 440
            # invalid wheel version, so reject it here rather than ship it.
            if [[ ! "${RELEASE_TAG}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '${RELEASE_TAG}' is not unprefixed semver (X.Y.Z or X.Y.Z-prerelease)."
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PRERELEASE_SUFFIX="${BASH_REMATCH[4]:-}"

            # The exact version tag is always published and never moves.
            TAGS="${IMAGE}:${RELEASE_TAG}"

            # Moving tags are stable-only. Either a semver prerelease suffix
            # or the GitHub "prerelease" checkbox is enough to hold them back.
            if [[ -z "${PRERELEASE_SUFFIX}" && "${IS_PRERELEASE}" != "true" ]]; then
              TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR},${IMAGE}:${MAJOR},${IMAGE}:latest"
            else
              echo "Prerelease — publishing only ${IMAGE}:${RELEASE_TAG}"
            fi
          else
            # Continuous builds off main. :latest is deliberately absent —
            # it belongs to releases now. Track :dev for the newest build.
            TAGS="${IMAGE}:dev,${IMAGE}:main-${SHA_SHORT}"
          fi

          echo "image=${IMAGE}"           >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"             >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}"   >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Production runs on amd64. arm64 is left out to keep build time
          # bounded; add it here if a Pi worker ever needs the same image.
          platforms: linux/amd64
          pull: "true"
          push: "true"
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=trawlarr
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.build_date }}
            org.opencontainers.image.description=Trawlarr — self-hosted, no-phone-home fork of Unmanic. See FORK.md.
            source.repo=rgregg/trawlarr
            source.branch=main
            source.sha=${{ steps.tags.outputs.sha_short }}
          cache-from: type=gha,scope=trawlarr-main
          cache-to: type=gha,scope=trawlarr-main,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Suggest the tag that matches what was actually built, so the
          # summary never tells someone to pull an image this run didn't push.
          if [[ "${EVENT_NAME}" == "release" ]]; then
            PULL_TAG="latest"
          else
            PULL_TAG="dev"
          fi
          {
            echo "## Built and pushed"
            echo ""
            echo "Tags:"
            echo "${TAGS}" | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/'
            echo ""
            echo "Pull with:"
            echo '```bash'
            echo "docker pull ${IMAGE}:${PULL_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
