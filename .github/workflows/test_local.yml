name: Test local fork

# Runs the unit test suite on every push to local and on PRs targeting it.
# Upstream's CI workflow has the pytest step commented out
# ("Unit testing is disabled until further notice"); this fork re-enables
# it for our test files (and any upstream tests that happen to live under
# tests/unit/).
#
# Coverage is reported in the job summary and uploaded as an artifact so
# we can track the trend over time.

on:
  push:
    branches: ["local"]
  pull_request:
    branches: ["local"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (errors only)
        run: |
          # E9 syntax errors, F63 invalid is/in comparisons, F7 forward
          # ref syntax, F82 undefined names. Style/E5xx noise from
          # upstream code is intentionally ignored.
          flake8 unmanic tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with coverage
        run: |
          # --cov=unmanic narrows coverage to our package (skips dep noise)
          # --cov-report=term-missing shows uncovered lines in the run log
          # --cov-report=xml uploads a machine-readable artifact
          # --cov-report=html for browsable local viewing of the same data
          # --cov-fail-under enforces a floor; bump as coverage improves.
          pytest tests/unit/ -v \
            --cov=unmanic \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=13 \
            --junitxml=pytest-results.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            if [ -f coverage.xml ]; then
              # `coverage report` reads .coverage by default, which pytest-cov
              # leaves behind alongside the XML. Markdown format keeps the
              # summary readable in the GHA job summary.
              echo '```'
              coverage report --skip-empty --skip-covered || coverage report
              echo '```'
            else
              echo "_coverage.xml not produced — pytest may have failed before coverage was written_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 30
