name: Build image

# Builds the rgregg/unmanic Docker image from main and
# pushes it to GHCR.
#
# Image: ghcr.io/<owner>/unmanic
# Tags:  :local                 (rolling)
#        :local-<sha7>          (immutable, for pinning in Komodo)
#        :local-<py-version>    (e.g. local-0.2.16, when the python version bumps)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build wheel + Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch tags (setup.py reads them for the version)
        run: |
          git fetch --prune --unshallow --tags || true
          git tag --list | tail -10

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Build Python wheel
        id: wheel
        run: |
          PY_VERSION=$(python ./setup.py --quiet --version)
          echo "Python version: ${PY_VERSION}"
          python -m build --no-isolation --skip-dependency-check --wheel
          ls -l dist/
          echo "${PY_VERSION}" > dist/VERSION.txt
          echo "py_version=${PY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PY_VERSION: ${{ steps.wheel.outputs.py_version }}
        run: |
          ORG=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${ORG}/unmanic"
          SHA_SHORT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAGS="${IMAGE}:latest,${IMAGE}:main-${SHA_SHORT}"
          if [[ -n "${PY_VERSION}" ]]; then
            TAGS="${TAGS},${IMAGE}:${PY_VERSION}"
          fi
          echo "image=${IMAGE}"           >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"             >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}"   >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Production runs on amd64. arm64 is left out to keep build time
          # bounded; add it here if a Pi worker ever needs the same image.
          platforms: linux/amd64
          pull: "true"
          push: "true"
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=unmanic
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.build_date }}
            org.opencontainers.image.description=Self-hosted no-phone-home fork of Unmanic. See FORK.md.
            source.repo=rgregg/unmanic
            source.branch=main
            source.sha=${{ steps.tags.outputs.sha_short }}
          cache-from: type=gha,scope=unmanic-main
          cache-to: type=gha,scope=unmanic-main,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## Built and pushed"
            echo ""
            echo "Tags:"
            echo "${TAGS}" | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/'
            echo ""
            echo "Pull with:"
            echo '```bash'
            echo "docker pull ${IMAGE}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
