name: Test

# Runs the unit test suites on every push to main and on PRs targeting it.
#
# Two independent jobs: the Python package, and the Quasar/Vue frontend.
# Until now nothing checked the frontend before the Docker image build, so a
# broken import in a .vue file reached image-build time undetected. The
# frontend job exists to make that failure loud and early.
#
# Coverage is reported in the job summary and uploaded as an artifact so
# we can track the trend over time.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check license headers
        run: |
          # Every .py file is either upstream's (Unmanic copyright block) or
          # fork-authored (SPDX identifier). Catches new fork files committed
          # without a header. Policy lives in docs/CONTRIBUTING.md.
          ./devops/check_license_headers.sh

      - name: Lint (errors only)
        run: |
          # E9 syntax errors, F63 invalid is/in comparisons, F7 forward
          # ref syntax, F82 undefined names. Style/E5xx noise from
          # upstream code is intentionally ignored.
          flake8 trawlarr tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with coverage
        run: |
          # --cov=trawlarr narrows coverage to our package (skips dep noise).
          # It must name the real package, not the `unmanic` compatibility
          # alias -- that is a three-line bootstrap, and pointing coverage
          # at it would silently report ~100% of nothing.
          # --cov-report=term-missing shows uncovered lines in the run log
          # --cov-report=xml uploads a machine-readable artifact
          # --cov-report=html for browsable local viewing of the same data
          # --cov-fail-under enforces a floor. It is a ratchet, not a target:
          # keep it just under the number main actually measures, raise it in
          # the PR that raises coverage, and never lower it to turn a build
          # green. main measures 31.78% at 311 tests; the floor was 13, which
          # meant coverage could have halved unnoticed. Policy lives in
          # docs/CONTRIBUTING.md ("The coverage ratchet").
          pytest tests/unit/ -v \
            --cov=trawlarr \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=30 \
            --junitxml=pytest-results.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            if [ -f coverage.xml ]; then
              # `coverage report` reads .coverage by default, which pytest-cov
              # leaves behind alongside the XML. Markdown format keeps the
              # summary readable in the GHA job summary.
              echo '```'
              coverage report --skip-empty --skip-covered || coverage report
              echo '```'
            else
              echo "_coverage.xml not produced — pytest may have failed before coverage was written_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 30

  frontend:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trawlarr/webserver/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # Matches the Node used by .github/workflows/build.yml, so a green
          # run here means the same toolchain that builds the image is happy.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: trawlarr/webserver/frontend/package-lock.json

      - name: Install dependencies
        # `npm ci`, not `npm install`: it installs exactly the lockfile, so CI
        # cannot pass on a dependency tree nobody has committed.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        # Thresholds live in vitest.config.js. See the ratchet note there and in
        # docs/CONTRIBUTING.md before changing them.
        run: npm run test:coverage

      - name: Build
        # The real prize. Quasar's webpack build is the only thing that resolves
        # every import in every .vue file, so this step is what turns "a broken
        # import reaches the Docker build" into "a broken import fails the PR".
        run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Frontend coverage"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              echo '```'
              node -e '
                const s = require("./coverage/coverage-summary.json").total;
                for (const k of ["statements", "branches", "functions", "lines"]) {
                  console.log(k.padEnd(12), s[k].pct + "%", `(${s[k].covered}/${s[k].total})`);
                }
              '
              echo '```'
              echo ""
              echo "_Statement/line coverage is inflated by modules that are imported but not exercised; \`functions\` is the honest number._"
            else
              echo "_No coverage summary produced — the test step likely failed first._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: trawlarr/webserver/frontend/coverage/
          retention-days: 14
